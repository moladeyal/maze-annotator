<!doctype html>
<html lang="he"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Maze</title>
<style>
 html,body{margin:0;height:100%;background:#1c1c1c;color:#eee;font:14px/1.4 sans-serif;overflow:hidden}
 #bar{position:absolute;top:0;left:0;right:0;padding:5px 10px;background:#000a;z-index:2;font-size:13px}
 #stage{position:absolute;inset:28px 0 0 0;display:flex;align-items:center;justify-content:center}
 canvas{max-width:100%;max-height:100%;touch-action:none}
 kbd{background:#444;border-radius:3px;padding:0 5px}
</style></head><body>
<div id="bar">arrows / WASD / numpad (diagonals ok) &middot; or hold the mouse/finger to walk toward it &middot; <kbd>L</kbd> lines <kbd>G</kbd> regions <kbd>R</kbd> restart <span id="info"></span></div>
<div id="stage"><canvas id="c"></canvas></div>
<script src="game-core.js"></script>
<script>
(async () => {
  const MC = window.MazeCore;
  const ann = await (await fetch('annotations.json')).json();
  const img = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = ann.image.file || 'work.jpg'; });
  const W = ann.image.w, H = ann.image.h;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'); cv.width = W; cv.height = H;
  const field = MC.buildField(ann.lines, W, H);
  const radius = ann.hero_radius || 4, speed = MC.speedFor(W, H);
  const regions = ann.regions || [], portals = ann.portals || [];
  let hero, showLines = false, showRegions = false;
  function reset() {
    const st = MC.findRegion(regions, 'start');
    const c = st ? MC.regionCenter(st) : [W / 2, H / 2];
    const p = MC.nearestWalkable(field, c[0], c[1], radius, 80);
    hero = MC.newHero(p[0], p[1], radius);
    for (const q of portals) for (const id of [q.a, q.b]) { const R = regions.find(r => r.id === id); if (R && MC.regionContains(R, hero.x, hero.y)) hero.inactive.add(id); }
  }
  reset();
  const keys = new Set(); let pointer = null;
  addEventListener('keydown', e => {
    if (e.code.startsWith('Arrow') || e.code.startsWith('Numpad') || ['Home','End','PageUp','PageDown','Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
    if (e.code === 'KeyL') showLines = !showLines; else if (e.code === 'KeyG') showRegions = !showRegions; else if (e.code === 'KeyR') reset();
  });
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());
  const toImg = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height }; };
  cv.addEventListener('pointerdown', e => { pointer = toImg(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (pointer) pointer = toImg(e); });
  cv.addEventListener('pointerup', () => pointer = null);
  cv.addEventListener('pointercancel', () => pointer = null);
  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let v = MC.keyVector(keys); if (!v[0] && !v[1]) v = MC.pointerVector(hero, pointer);
    if (v[0] || v[1]) MC.moveHero(field, hero, v[0], v[1], speed * dt);
    MC.updatePortals(field, hero, regions, portals);
    ctx.drawImage(img, 0, 0);
    if (showLines) { ctx.strokeStyle = '#1d4fd8'; ctx.lineWidth = 2; ctx.beginPath(); for (const l of ann.lines) { ctx.moveTo(l.pts[0][0], l.pts[0][1]); for (const p of l.pts) ctx.lineTo(p[0], p[1]); } ctx.stroke(); }
    if (showRegions) { ctx.strokeStyle = '#d81b60'; ctx.lineWidth = 2; for (const r of regions) { ctx.beginPath(); if (r.shape === 'ellipse') ctx.ellipse(r.cx, r.cy, r.rx, r.ry, 0, 0, 7); else { ctx.moveTo(r.pts[0][0], r.pts[0][1]); r.pts.forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath(); } ctx.stroke(); } }
    const R = radius + 2.5;
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(hero.x, hero.y, R, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(hero.x - R * .35, hero.y - R * .2, R * .14, 0, 7); ctx.arc(hero.x + R * .35, hero.y - R * .2, R * .14, 0, 7); ctx.fill();
    requestAnimationFrame(loop);
  })(last);
})();
</script></body></html>
